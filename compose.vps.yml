# Standalone VPS configuration: do not combine with the local Compose files.
name: rexios-vps

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "2"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rexios
      POSTGRES_DB: rexios
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    logging: *logging

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    working_dir: /app/server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://rexios:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@db:5432/rexios"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env.vps}"
      APP_ORIGIN: https://rexios.duckdns.org
      UPLOAD_DIR: /app/uploads
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-123}"
      FEATHERLESS_API_KEY: "${FEATHERLESS_API_KEY:-}"
      FEATHERLESS_BASE_URL: "${FEATHERLESS_BASE_URL:-https://api.featherless.ai/v1}"
      FEATHERLESS_MODEL: "${FEATHERLESS_MODEL:-google/gemma-4-31B-it}"
      FEATHERLESS_EMBEDDING_MODEL: "${FEATHERLESS_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      AI_REQUEST_TIMEOUT_MS: "${AI_REQUEST_TIMEOUT_MS:-180000}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-12000}"
      AI_MAX_REPAIR_ATTEMPTS: "${AI_MAX_REPAIR_ATTEMPTS:-2}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging: *logging

  # Unique service name prevents a 'web' DNS alias on the shared edge network.
  rexios-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - edge
    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 128
    logging: *logging

networks:
  default: {}
  edge:
    external: true
    name: "${REXIOS_EDGE_NETWORK:-fidelgo-vps-dev-edge}"

volumes:
  database: {}
  uploads: {}
